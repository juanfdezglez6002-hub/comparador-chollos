<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CholloTracker | Recomendaciones</title>
    <style>
        :root {
            --primary: #FF9900;
            --dark: #131921;
            --gray: #F0F2F2;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--gray); margin: 0; color: var(--dark); }

        header { background: var(--dark); color: white; padding: 40px 20px; text-align: center; }
        header h1 { margin: 0; font-size: 2.5rem; }

        .nav-categories {
            display: flex; justify-content: center; gap: 10px; padding: 15px;
            background: white; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .nav-tag {
            padding: 8px 15px; background: var(--gray); border-radius: 5px;
            text-decoration: none; color: var(--dark); font-weight: bold; font-size: 0.9rem;
        }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        
        /* Estilos del Grid */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 25px; 
            margin-bottom: 50px;
        }

        .card {
            background: white; border-radius: 10px; overflow: hidden;
            display: flex; flex-direction: column; transition: 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

        .img-box { height: 220px; padding: 15px; display: flex; align-items: center; justify-content: center; }
        .img-box img { max-height: 100%; max-width: 100%; object-fit: contain; }

        .info { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .info h3 { font-size: 1rem; margin: 0 0 8px; height: 40px; overflow: hidden; }
        .resumen { font-size: 0.85rem; color: #555; margin-bottom: 15px; }
        .price { font-size: 1.6rem; font-weight: 800; margin-bottom: 15px; color: #B12704; }

        .btn {
            background: var(--primary); color: var(--dark); text-align: center;
            padding: 12px; text-decoration: none; font-weight: bold; border-radius: 5px;
        }
        
        h2 { background: #232f3e; color: white; padding: 10px 20px; border-radius: 8px; display: inline-block; }
    </style>
</head>
<body>

<header>
    <h1>Mis Recomendaciones</h1>
    <p>Selección manual de productos calidad-precio</p>
</header>

<div class="nav-categories" id="cat-nav"></div>

<div class="container" id="main-content">
    </div>

<script>
    async function load() {
        try {
            // Añadimos timestamp para evitar que el navegador use una versión vieja del JSON
            const res = await fetch('data.json?v=' + Date.now());
            const data = await res.json();
            const mainContent = document.getElementById('main-content');
            const nav = document.getElementById('cat-nav');

            mainContent.innerHTML = '';
            nav.innerHTML = '';

            // Si tu JSON tiene la estructura antigua (lista plana), la agrupamos aquí:
            const productos = data.productos || [];
            const categoriasAgrupadas = productos.reduce((acc, p) => {
                const cat = p.categoria || 'General';
                if (!acc[cat]) acc[cat] = [];
                acc[cat].push(p);
                return acc;
            }, {});

            for (const [nombreCat, lista] of Object.entries(categoriasAgrupadas)) {
                // Crear botón nav
                nav.innerHTML += `<a href="#section-${nombreCat}" class="nav-tag">${nombreCat}</a>`;

                // Crear sección
                const section = document.createElement('section');
                section.id = `section-${nombreCat}`;
                
                // Generar el HTML de las tarjetas
                let cardsHtml = '';
                lista.forEach(p => {
                    // Usamos || para que funcione con "precio" o "precio_amazon" según tu Python
                    const precioMostrar = p.precio || p.precio_amazon + "€";
                    const descResumen = p.resumen || "Producto recomendado por su calidad y precio.";
                    
                    cardsHtml += `
                        <div class="card">
                            <div class="img-box"><img src="${p.imagen}" alt="${p.nombre}"></div>
                            <div class="info">
                                <h3>${p.nombre}</h3>
                                <p class="resumen">${descResumen}</p>
                                <div class="price">${precioMostrar}</div>
                                <a href="${p.url_afiliado || p.url}" class="btn" target="_blank">Ver en Amazon</a>
                            </div>
                        </div>
                    `;
                });

                section.innerHTML = `
                    <div class="category-header"><h2>${nombreCat}</h2></div>
                    <div class="grid">${cardsHtml}</div>
                `;
                mainContent.appendChild(section);
            }
        } catch (e) {
            console.error("Error:", e);
            document.getElementById('main-content').innerHTML = "<h3>Cargando recomendaciones...</h3><p>Si no aparecen, asegúrate de haber ejecutado update_prices.py</p>";
        }
    }
    load();
</script>
</body>
</html>
