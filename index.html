<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CholloTracker | Recomendaciones</title>
    <style>
        :root {
            --primary: #FF9900;
            --dark: #131921;
            --gray: #F0F2F2;
        }

        body { font-family: 'Segoe UI', sans-serif; background: var(--gray); margin: 0; color: var(--dark); }

        header { background: var(--dark); color: white; padding: 40px 20px; text-align: center; }
        header h1 { margin: 0; font-size: 2.5rem; }

        /* Navegación por categorías */
        .nav-categories {
            display: flex; justify-content: center; gap: 10px; padding: 15px;
            background: white; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .nav-tag {
            padding: 8px 15px; background: var(--gray); border-radius: 5px;
            text-decoration: none; color: var(--dark); font-weight: bold; font-size: 0.9rem;
        }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }

        /* Tarjeta Directa */
        .card {
            background: white; border-radius: 10px; overflow: hidden;
            display: flex; flex-direction: column; transition: 0.3s;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }

        .img-box { height: 220px; padding: 15px; display: flex; align-items: center; justify-content: center; }
        .img-box img { max-height: 100%; max-width: 100%; object-fit: contain; }

        .info { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .info h3 { font-size: 1rem; margin: 0 0 8px; height: 40px; overflow: hidden; }
        .resumen { font-size: 0.85rem; color: #555; margin-bottom: 15px; }
        
        /* Precio Único */
        .price { font-size: 1.6rem; font-weight: 800; margin-bottom: 15px; }

        .btn {
            background: var(--primary); color: var(--dark); text-align: center;
            padding: 12px; text-decoration: none; font-weight: bold; border-radius: 5px;
        }
    </style>
</head>
<body>

<header>
    <h1>Mis Recomendaciones</h1>
    <p>Selección manual de productos calidad-precio</p>
</header>

<div class="nav-categories" id="cat-nav"></div>

<div class="container">
    <div class="grid" id="product-grid"></div>
</div>

<script>
    async function load() {
        const res = await fetch('data.json');
        const data = await res.json();
        const grid = document.getElementById('product-grid');
        const nav = document.getElementById('cat-nav');

        data.categorias.forEach(c => {
            nav.innerHTML += `<a href="#${c}" class="nav-tag">${c}</a>`;
        });

        data.productos.forEach(p => {
            grid.innerHTML += `
                <div class="card">
                    <div class="img-box"><img src="${p.imagen}" alt="${p.nombre}"></div>
                    <div class="info">
                        <h3>${p.nombre}</h3>
                        <p class="resumen">${p.resumen}</p>
                        <div class="price">${p.precio}</div>
                        <a href="${p.url}" class="btn" target="_blank">Ver en Amazon</a>
                    </div>
                </div>
            `;
        });
    }
    load();
</script>
</body>
</html>
